name: Deploy marimo dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install marimo
        run: |
          python -m pip install --upgrade pip
          python -m pip install "marimo==0.23.16" uv

      - name: Diagnostics
        run: |
          set -x
          python -VV
          python -m marimo --version
          pwd
          ls -la
          ls -la public

      - name: Export notebook to WASM
        run: |
          set -euxo pipefail
                    python -m marimo export html-wasm app.py -o dist --mode run
          touch dist/.nojekyll
          ls -la dist
          ls -la dist/public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
